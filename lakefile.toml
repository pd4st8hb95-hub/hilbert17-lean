name = "hilbert17"
version = "0.1.0"
defaultTargets = ["Hilbert17", "Hilbert17RealClosure"]

[[lean_lib]]
name = "Hilbert17"
roots = ["Hilbert17", "TargetSpec", "ClearDenominators", "FractionSemireal", "OrderingSeparation", "RealInstance", "CoefficientOrder", "LocalizationSignDescent", "TargetSanity", "CertificateNonnegative", "ConditionalArtin"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "520045ab14e26149ee970e2e617ca04b09bde5d6"

[[lean_lib]]
name = "Hilbert17RealClosure"
roots = ["Hilbert17RealClosure", "TauCeti.Algebra.Order.Ring.Ordering.Extension", "TauCeti.Algebra.Polynomial.OddDegreeFactor", "TauCeti.FieldTheory.RealClosure.Basic", "TauCeti.FieldTheory.RealClosure.OddExtension", "TauCeti.FieldTheory.RealClosure.OrderExtension", "TauCeti.FieldTheory.RealClosure.OrderedIntermediateField", "TauCeti.FieldTheory.RealClosure.PolynomialCone"]
